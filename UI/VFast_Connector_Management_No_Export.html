.tree-table .company-logo,.tree-table .provider-logo,.tree-table .license-icon{border:0;border-radius:4px}
.level-label{border:0;background:#edf2f8;color:#7c8ea3}
.tree-level-1:before,.tree-level-2:before,.hierarchy-line,.license-trail{border-color:#e7edf4}
.count-mini{background:#eef3f9;border:0}
.pager{border-top:1px solid #f0f2f5}
.pager select,.pagination button{border-color:transparent!important;background:#f3f5f8}

/* Final toolbar: search-first, three grouped filters, sort aligned right. */
.filters{display:grid;grid-template-columns:minmax(260px,1.35fr) auto minmax(150px,180px);align-items:center;gap:12px;padding:1px 24px 22px}
.filters .search{min-width:0;width:100%;flex:none}
.filters .search input{height:39px;width:100%;background:#f3f5f8}
.filters .search svg{top:11px}
.filter-selects{display:flex;align-items:center;gap:8px;min-width:0}

.filters .sort-select select{width:100%;min-width:0;height:39px}

@media(max-width:1350px){.filters{grid-template-columns:minmax(260px,1fr) minmax(145px,175px)}.filter-selects{grid-column:1;grid-row:2;flex-wrap:wrap}.filters .sort-select{grid-column:2;grid-row:1}.filters .search{grid-column:1;grid-row:1}}
@media(max-width:850px){.filters{display:flex;flex-wrap:wrap;padding:0 15px 16px;gap:9px}.filters .search{flex:1 1 100%;min-width:0;order:0}.filter-selects{flex:1 1 auto;order:1;flex-wrap:wrap}.filter-selects .select-wrap{flex:1 1 130px}.filter-selects .select-wrap select{width:100%;min-width:0}.filters .sort-select{order:2;flex:1 1 160px}.filters .sort-select select{width:100%}}
</style>

<div class="app">
<aside class="sidebar">
  <div class="brand"><span class="brand-mark"></span>VFast</div>
  <nav class="nav" aria-label="Navigation">
    <button class="nav-item" data-nav="Overview"><svg><use href="#i-home"/></svg>Overview</button>
    <button class="nav-item" data-nav="Budget"><svg><use href="#i-budget"/></svg>Budget</button>
    <button class="nav-item" data-nav="License"><svg><use href="#i-license"/></svg>License</button>
    <button class="nav-item active"><svg><use href="#i-plug"/></svg>Connector Management</button>
    <button class="nav-item" data-nav="Reports"><svg><use href="#i-chart"/></svg>Reports</button>
    <button class="nav-item" data-nav="Settings"><svg><use href="#i-settings"/></svg>Settings</button>
  </nav>
  <div class="side-footer"><div class="avatar">AD</div><div><strong>Administrator</strong><span>Vingroup</span></div></div>
</aside>
<main class="main">
  <header class="topbar"><span class="mobile-head">VFast</span><button class="bell" id="alerts" title="Sync issues" aria-label="Sync issues"><svg><use href="#i-bell"/></svg></button><div class="avatar">AD</div></header>
  <div class="content">
    <div class="page-head"><h1>Connector Management</h1><div class="page-actions"><button class="btn primary" id="newBtn"><svg><use href="#i-plus"/></svg>New Connector</button></div></div>
    <section class="metrics" aria-label="Metrics">
      <div class="metric"><div><h2>Companies</h2><div class="value" id="metricCompanies">0</div></div><span class="metric-icon"><svg><use href="#i-building"/></svg></span></div>
      <div class="metric"><div><h2>Providers</h2><div class="value" id="metricProviders">0</div></div><span class="metric-icon"><svg><use href="#i-layers"/></svg></span></div>
      <div class="metric"><div><h2>Licenses</h2><div class="value" id="metricLicenses">0</div></div><span class="metric-icon"><svg><use href="#i-license"/></svg></span></div>
      <div class="metric"><div><h2>Sync Issues</h2><div class="value" id="metricIssues">0</div></div><span class="metric-icon"><svg><use href="#i-alert"/></svg></span></div>
    </section>
    <section class="panel" aria-label="Company provider license table">
      <div class="filters">
        <label class="search"><svg><use href="#i-search"/></svg><input id="searchInput" type="search" placeholder="Search company, provider, license..." aria-label="Search connectors" /></label>
        <div class="filter-selects">
          <label class="select-wrap"><select id="companyFilter" aria-label="Filter company"><option value="">All companies</option></select></label>
          <label class="select-wrap"><select id="providerFilter" aria-label="Filter provider"><option value="">All providers</option></select></label>
          <label class="select-wrap"><select id="statusFilter" aria-label="Filter license status"><option value="">All statuses</option><option value="healthy">Active</option><option value="delayed">Delayed</option><option value="failed">Failed</option><option value="pending">Pending</option></select></label>
        </div>
        <label class="select-wrap sort-select"><select id="sortFilter" aria-label="Sort companies"><option value="name">Name A–Z</option><option value="nameDesc">Name Z–A</option><option value="providers">Most providers</option><option value="licenses">Most licenses</option><option value="recent">Recent sync</option></select></label>
        <span class="active-filter" id="filterTag"></span>
      </div>
      <div class="table-wrap"><table class="tree-table">
        <colgroup><col style="width:35%"/><col style="width:13%"/><col style="width:21%"/><col style="width:11%"/><col style="width:11%"/><col style="width:8%"/><col style="width:42px"/></colgroup>
        <thead><tr><th>Company / Provider / License</th><th>Coverage</th><th>API Contact</th><th>Created</th><th>Last Sync</th><th>Status</th><th aria-label="Actions"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <div class="pager"><div class="pager-left"><span id="resultCount">0 companies</span><select id="pageSize" aria-label="Companies per page"><option value="5">5 / page</option><option value="8" selected>8 / page</option><option value="10">10 / page</option></select></div><div class="pagination" id="pages"></div></div>
    </section>
  </div>
</main>
</div>
<div class="overlay" id="modalOverlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="dialog-head"><h2 id="modalTitle">New Connector</h2><button class="btn icon" id="closeModal" aria-label="Close"><svg><use href="#i-x"/></svg></button></div>
  <form id="createForm" autocomplete="off">
  <div class="dialog-body form-body">
    <div class="form-section"><div class="form-section-title">General</div>
      <div class="form-grid">
        <div class="field"><label for="formCompany">Company <span class="req">*</span></label><select id="formCompany" required></select></div>
        <div class="field"><label for="formProvider">Provider <span class="req">*</span></label><select id="formProvider" required></select></div>
        <div class="field"><label for="formName">Connector Name <span class="req">*</span></label><input id="formName" required maxlength="80" placeholder="e.g. VinFast – Microsoft Usage"></div>
        <div class="field"><label for="formFrequency">Sync Frequency <span class="req">*</span></label><select id="formFrequency" required><option>Hourly</option><option selected>Every 6 hours</option><option>Daily</option><option>Weekly</option></select></div>
        <div class="field"><label for="formOwner">API Contact <span class="req">*</span></label><input id="formOwner" required placeholder="Full name"></div>
        <div class="field"><label for="formEmail">Contact Email <span class="req">*</span></label><input type="email" id="formEmail" required placeholder="contact@company.com"></div>
      </div>
    </div>
    <div class="form-section"><div class="form-section-title">API Configuration</div>
      <div class="form-grid">
        <div class="field"><label for="formBaseUrl">API Base URL <span class="req">*</span></label><input id="formBaseUrl" type="url" pattern="https://.*" title="HTTPS URL required" required placeholder="https://api.provider.com/v1"></div>
        <div class="field"><label for="formAuth">Authentication <span class="req">*</span></label><select id="formAuth" required><option value="api-key">API Key</option><option value="bearer">Bearer Token</option><option value="oauth">OAuth 2.0</option><option value="basic">Basic Auth</option><option value="none">None</option></select></div>
        <div class="field" id="usernameField" hidden><label for="formUsername">Username <span class="req">*</span></label><input id="formUsername" autocomplete="off" placeholder="API username"></div>
        <div class="field" id="secretField"><label for="formSecret" id="secretLabel">API Key <span class="req">*</span></label><div class="secret-wrap"><input id="formSecret" type="password" required autocomplete="new-password" placeholder="Enter API key"><button type="button" class="secret-toggle" id="toggleSecret" aria-label="Show credential" title="Show / hide"> <svg><use href="#i-eye"/></svg></button></div></div>
        <div class="field" id="headerField"><label for="formHeader">Header Name</label><input id="formHeader" value="X-API-Key" placeholder="X-API-Key"></div>
        <div class="field"><label for="formEndpoint">Usage Endpoint</label><input id="formEndpoint" placeholder="/usage or /reports/usage"></div>
      </div>
    </div>
    <div class="form-section"><div class="form-section-title">Licenses <span class="req">*</span></div>
      <div class="license-add-row"><div class="field"><label class="sr-only" for="licenseInput">License name</label><input id="licenseInput" list="licenseSuggestions" placeholder="Enter or select a license"><datalist id="licenseSuggestions"></datalist></div><button class="btn" id="addLicenseBtn" type="button"><svg><use href="#i-plus"/></svg>Add License</button></div>
      <div class="selected-licenses" id="selectedLicenses" aria-live="polite"></div>
      <div class="field-invalid" id="licenseError" role="alert" hidden>At least one license is required.</div>
    </div>
  </div>
  <div class="dialog-foot"><button class="btn" id="cancelBtn" type="button">Cancel</button><button class="btn primary" type="submit"><svg><use href="#i-plus"/></svg>Create Connector</button></div>
  </form>
</div></div>
<div class="drawer-overlay" id="drawerOverlay"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><div class="dialog-head"><h2 id="drawerTitle">Connector</h2><button id="closeDrawer" class="btn icon" aria-label="Close"><svg><use href="#i-x"/></svg></button></div><div class="dialog-body" id="drawerBody"></div><div class="dialog-foot"><button class="btn" id="drawerDone">Close</button></div></aside></div>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const companies={
  vinfast:{id:'CMP-001',name:'VinFast',short:'VF',color:'#1c3d64',logo:'https://webp.vp.cdn.pxr.nl/tag/e0ff5c06f0b6642cae4b45bc492b7b376a454ecb.jpg?width=400'},
  vinhomes:{id:'CMP-002',name:'Vinhomes',short:'VH',color:'#bd8433',logo:'https://cdn.haitrieu.com/wp-content/uploads/2022/01/Logo-Vinhomes.png'},
  vinmec:{id:'CMP-003',name:'Vinmec',short:'VM',color:'#227fa9',logo:'https://cdn.brandfetch.io/idTRWn9_4q/w/1440/h/1440/theme/dark/icon.jpeg?c=1bxid64Mup7aczewSAYMX&t=1744123105261'},
  vinpearl:{id:'CMP-004',name:'Vinpearl',short:'VP',color:'#a6894a',logo:'https://images.seeklogo.com/logo-png/62/1/vinpearl-logo-png_seeklogo-624623.png'},
  vinschool:{id:'CMP-005',name:'Vinschool',short:'VS',color:'#a94750',logo:'https://teachinvietnam.com.vn/uploads/_img_companies/17_vinschool-logo.jpg'},
  vinuni:{id:'CMP-006',name:'VinUniversity',short:'VU',color:'#a84b51',logo:'https://lwfiles.mycourse.app/6673e78305c5f7f5b79b3e21-public/83f6bd0e51f5c31fbc17fbf0cfd091f0.png'},
  vincom:{id:'CMP-007',name:'Vincom Retail',short:'VC',color:'#b65361',logo:'https://longtruongvu.vn/UserFile/editor/images/Customer/vincomretail.jpg'},
  vinrobotics:{id:'CMP-008',name:'VinRobotics',short:'VR',color:'#587ba8',logo:''},
  vinsmart:{id:'CMP-009',name:'Vinsmart Future',short:'VFu',color:'#6582b2',logo:''},
  vincss:{id:'CMP-010',name:'VinCSS',short:'VCs',color:'#518ca0',logo:''}
};
const providers={
  microsoft:{name:'Microsoft',short:'MS',bg:'#f1f6fc',color:'#2462a0'},
  atlassian:{name:'Atlassian',short:'A',bg:'#eaf3ff',color:'#236bd0'},
  adobe:{name:'Adobe',short:'Ad',bg:'#fff1f1',color:'#cf3643'},
  github:{name:'GitHub',short:'GH',bg:'#e9edf2',color:'#252c37'},
  google:{name:'Google Workspace',short:'G',bg:'#eff6ff',color:'#4285f4'},
  figma:{name:'Figma',short:'F',bg:'#f4edfc',color:'#8256b3'},
  jetbrains:{name:'JetBrains',short:'JB',bg:'#f2edfb',color:'#7049a4'},
  zoom:{name:'Zoom',short:'Z',bg:'#edf4fe',color:'#2f6dcc'},
  sap:{name:'SAP',short:'SAP',bg:'#eaf5fd',color:'#1873b2'}
};
const people={
  vinfast:['Nguyễn Minh Anh','api.vinfast@example.com'],vinhomes:['Trần Bảo Ngọc','it.vinhomes@example.com'],
  vinmec:['Phạm Quốc Huy','tech.vinmec@example.com'],vinpearl:['Lê Khánh Linh','it.vinpearl@example.com'],
  vinschool:['Vũ Thu Hà','it.vinschool@example.com'],vinuni:['Đỗ Hoàng Long','digital.vinuni@example.com'],
  vincom:['Hoàng Minh Đức','integration.vincom@example.com'],vinrobotics:['Bùi Thanh Bình','ops.vinrobotics@example.com'],
  vinsmart:['Ngô Phương Mai','it.vinsmart@example.com'],vincss:['Đặng Anh Tuấn','api.vincss@example.com']
};
// Fictional design data. Company names are illustrative and do not assert legal ownership relationships.
const fixtures=[
 ['vinfast','microsoft',['Microsoft 365 E3','Power BI Pro','Teams Premium'],'healthy'],
 ['vinfast','atlassian',['Jira Software','Confluence'],'healthy'],
 ['vinfast','adobe',['Creative Cloud','Acrobat Pro'],'delayed'],
 ['vinfast','sap',['SAP S/4HANA','SAP Analytics Cloud'],'healthy'],
 ['vinhomes','salesforce',['Sales Cloud Enterprise'],'healthy'],
 ['vinhomes','microsoft',['Microsoft 365 E5','Power BI Pro'],'healthy'],
 ['vinmec','microsoft',['Microsoft 365 E3','Teams Premium'],'healthy'],
 ['vinmec','zoom',['Zoom Workplace Pro','Zoom Rooms'],'failed'],
 ['vinpearl','adobe',['Creative Cloud','Acrobat Pro'],'healthy'],
 ['vinpearl','sap',['SAP Ariba','SAP SuccessFactors'],'pending'],
 ['vinschool','google',['Workspace Enterprise','Google Meet'],'healthy'],
 ['vinschool','zoom',['Zoom Workplace Pro'],'healthy'],
 ['vinuni','figma',['Figma Organization','FigJam'],'healthy'],
 ['vinuni','microsoft',['Microsoft 365 E3'],'healthy'],
 ['vincom','microsoft',['Microsoft 365 E3','Visio Plan 2'],'healthy'],
 ['vincom','google',['Workspace Business Plus'],'healthy'],
 ['vinrobotics','github',['GitHub Enterprise','GitHub Copilot'],'healthy'],
 ['vinrobotics','atlassian',['Jira Software','Confluence'],'delayed'],
 ['vinsmart','github',['GitHub Enterprise','GitHub Copilot'],'failed'],
 ['vinsmart','figma',['Figma Organization'],'healthy'],
 ['vincss','jetbrains',['IntelliJ Ultimate','All Products Pack'],'healthy'],
 ['vincss','microsoft',['Microsoft 365 E5'],'pending']
];
providers.salesforce={name:'Salesforce',short:'SF',bg:'#e9f8ff',color:'#2196d2'};
let connectors=fixtures.map((item,i)=>{
 const [company,provider,names,status]=item;
 const created=new Date(Date.UTC(2026,9,2+(i%28),9+(i%8),0)).toISOString();
 const sync=(status==='pending'?null:new Date(Date.UTC(2026,10,status==='failed'?10:status==='delayed'?12:13,2+(i%8),10+(i*7)%50)).toISOString());
 return {id:'CON-'+String(101+i).padStart(4,'0'),company,provider,owner:people[company][0],email:people[company][1],created,sync,frequency:'Every 6 hours',licenses:names.map((name,j)=>({id:'LIC-'+String(1001+i*4+j).padStart(4,'0'),name,status:status==='healthy' && i===0 && j===2?'delayed':status}))};
});
const state={search:'',company:'',provider:'',status:'',sort:'name',page:1,size:8};
const expandedCompanies=new Set(['vinfast','vinhomes']);
const expandedProviders=new Set(['CON-0101','CON-0105']);
const labelStatus={healthy:'Active',delayed:'Delayed',failed:'Failed',pending:'Pending'};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=id=>`<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;
function dateOnly(d){return d?new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Bangkok'}):'—'}
function timeOnly(d){return d?new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Bangkok'}):''}
function dateHtml(d){return d?`<div class="date">${dateOnly(d)}<span>${timeOnly(d)}</span></div>`:'<span class="soft">—</span>'}
function companyLogo(k){let c=companies[k];return `<span class="company-logo" style="--logo-color:${c.color}" title="${esc(c.name)}"><span>${esc(c.short)}</span>${c.logo?`<img src="${esc(c.logo)}" referrerpolicy="no-referrer" alt="" loading="lazy" onload="this.style.display='block'" onerror="this.remove()"/>`:''}</span>`}
function providerLogo(k){let p=providers[k];return `<span class="provider-logo" style="--provider-color:${p.color};--provider-bg:${p.bg}">${k==='microsoft'?'<span class="ms-logo"><i></i><i></i><i></i><i></i></span>':esc(p.short)}</span>`}
function statusHtml(s){return `<span class="pill ${s}">${labelStatus[s]}</span>`}
function chevron(open,command,key){return `<button class="chevron" aria-label="${open?'Collapse':'Expand'}" aria-expanded="${open}" data-${command}="${esc(key)}">${icon('chevron')}</button>`}
function licenseKey(c,l){return [companies[c.company].id,companies[c.company].name,providers[c.provider].name,c.id,c.owner,c.email,l.name,l.id].join(' ').toLowerCase()}
function filtered(){const q=state.search.trim().toLowerCase();return connectors.map(c=>{
 const licenseMatches=c.licenses.filter(l=>(!state.status||l.status===state.status)&&(!q||licenseKey(c,l).includes(q)));
 if((state.company&&c.company!==state.company)||(state.provider&&c.provider!==state.provider)||!licenseMatches.length)return null;
 return {...c,shownLicenses:licenseMatches};
 }).filter(Boolean)}
function grouped(){const by={};for(const c of filtered())(by[c.company]??=[]).push(c);
 const keys=Object.keys(by),sum=k=>by[k].reduce((n,c)=>n+c.shownLicenses.length,0),last=k=>Math.max(...by[k].map(c=>c.sync?Date.parse(c.sync):0));
 keys.sort((a,b)=>({name:()=>companies[a].name.localeCompare(companies[b].name),nameDesc:()=>companies[b].name.localeCompare(companies[a].name),providers:()=>by[b].length-by[a].length||companies[a].name.localeCompare(companies[b].name),licenses:()=>sum(b)-sum(a)||companies[a].name.localeCompare(companies[b].name),recent:()=>last(b)-last(a)})[state.sort]());
 for(const k of keys)by[k].sort((a,b)=>providers[a.provider].name.localeCompare(providers[b.provider].name));return {by,keys}}
function metrics(){let allLic=connectors.flatMap(c=>c.licenses);$('metricCompanies').textContent=Object.keys(companies).length;$('metricProviders').textContent=new Set(connectors.map(c=>c.provider)).size;$('metricLicenses').textContent=allLic.length;$('metricIssues').textContent=allLic.filter(l=>l.status==='failed'||l.status==='delayed').length}
function tag(kind){return `<span class="level-label">${kind}</span>`}
function trCompany(k,list){const c=companies[k],lc=list.reduce((s,r)=>s+r.shownLicenses.length,0),open=expandedCompanies.has(k),dates=list.map(r=>r.sync).filter(Boolean).sort();return `<tr class="company-row ${open?'is-open':''}"><td><div class="name-cell tree-level-0">${chevron(open,'company',k)}${companyLogo(k)}<span class="entity-name" title="${esc(c.name)}">${esc(c.name)}</span>${tag('Company')}</div></td><td><span class="coverage">${list.length} providers <span class="coverage-sep">·</span> ${lc} licenses</span></td><td><div class="contact"><strong>${esc(people[k][0])}</strong><a href="mailto:${esc(people[k][1])}">${esc(people[k][1])}</a></div></td><td><span class="soft">—</span></td><td>${dateHtml(dates.at(-1))}</td><td></td><td><button class="action-menu" data-add="${k}" title="Add connector" aria-label="Add connector for ${esc(c.name)}">${icon('plus')}</button></td></tr>`}
function trProvider(c){const open=expandedProviders.has(c.id);return `<tr class="provider-row"><td><div class="name-cell tree-level-1">${chevron(open,'provider',c.id)}${providerLogo(c.provider)}<span class="entity-name" title="${esc(providers[c.provider].name)}">${esc(providers[c.provider].name)}</span>${tag('Provider')}</div></td><td><span class="coverage">${c.shownLicenses.length} licenses</span></td><td><div class="contact"><strong>${esc(c.owner)}</strong><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div></td><td>${dateHtml(c.created)}</td><td>${dateHtml(c.sync)}</td><td></td><td><button class="action-menu" data-detail="${esc(c.id)}" title="Connector details" aria-label="Details: ${esc(providers[c.provider].name)}">${icon('more')}</button></td></tr>`}
function trLicense(c,l){return `<tr class="license-row"><td><div class="name-cell tree-level-2"><span class="spacer-chevron"></span><span class="license-icon">${icon('license')}</span><span class="entity-name" title="${esc(l.name)}">${esc(l.name)}</span>${tag('License')}</div></td><td><span class="soft">—</span></td><td></td><td></td><td>${dateHtml(c.sync)}</td><td>${statusHtml(l.status)}</td><td><button class="action-menu" data-detail="${esc(c.id)}" title="License details" aria-label="Details: ${esc(l.name)}">${icon('more')}</button></td></tr>`}
function render(){metrics();const {by,keys}=grouped(),totalPages=Math.max(1,Math.ceil(keys.length/state.size));state.page=Math.min(state.page,totalPages);const visible=keys.slice((state.page-1)*state.size,state.page*state.size);let html='';
 for(const k of visible){html+=trCompany(k,by[k]);if(expandedCompanies.has(k))for(const c of by[k]){html+=trProvider(c);if(expandedProviders.has(c.id))for(const l of c.shownLicenses)html+=trLicense(c,l)}}
 $('rows').innerHTML=html||`<tr><td class="empty" colspan="7">${icon('search')}<div>No matching results</div></td></tr>`;
 $('resultCount').textContent=keys.length?`${(state.page-1)*state.size+1}–${Math.min(state.page*state.size,keys.length)} of ${keys.length} companies`:'0 companies';
 let pages=`<button data-page="${Math.max(1,state.page-1)}" ${state.page===1?'disabled':''} aria-label="Previous page">‹</button>`;
 for(let p=1;p<=totalPages;p++)pages+=`<button data-page="${p}" class="${p===state.page?'active':''}" ${p===state.page?'aria-current="page"':''}>${p}</button>`;
 pages+=`<button data-page="${Math.min(totalPages,state.page+1)}" ${state.page===totalPages?'disabled':''} aria-label="Next page">›</button>`;$('pages').innerHTML=pages;

 $('filterTag').textContent='';
 document.querySelectorAll('[data-company]').forEach(b=>b.onclick=()=>{const k=b.dataset.company;expandedCompanies.has(k)?expandedCompanies.delete(k):expandedCompanies.add(k);render()});
 document.querySelectorAll('[data-provider]').forEach(b=>b.onclick=()=>{const k=b.dataset.provider;expandedProviders.has(k)?expandedProviders.delete(k):expandedProviders.add(k);render()});
 document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showDetails(b.dataset.detail));
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>showForm(b.dataset.add));
 document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=Number(b.dataset.page);render()});
}
function populateOptions(){const c=Object.entries(companies).sort((a,b)=>a[1].name.localeCompare(b[1].name));const p=Object.entries(providers).sort((a,b)=>a[1].name.localeCompare(b[1].name));$('companyFilter').innerHTML='<option value="">All companies</option>'+c.map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join('');$('providerFilter').innerHTML='<option value="">All providers</option>'+p.map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join('');$('formCompany').innerHTML=c.map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join('');$('formProvider').innerHTML=p.map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join('')}
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>t.classList.remove('show'),2800)}
let selectedLicenseNames=[];
function listProviderLicenses(){const k=$('formProvider').value;return [...new Set(connectors.filter(c=>c.provider===k).flatMap(c=>c.licenses.map(l=>l.name)))].sort()}
function renderSelectedLicenses(){const host=$('selectedLicenses');host.innerHTML=selectedLicenseNames.length?selectedLicenseNames.map((n,i)=>`<div class="license-chip"><span class="license-icon">${icon('license')}</span><span>${esc(n)}</span><button type="button" class="remove-license" data-remove-license="${i}" aria-label="Remove ${esc(n)}">${icon('x')}</button></div>`).join(''):'<div class="licenses-empty">No licenses selected</div>';host.querySelectorAll('[data-remove-license]').forEach(b=>b.onclick=()=>{selectedLicenseNames.splice(Number(b.dataset.removeLicense),1);renderSelectedLicenses()});$('licenseError').hidden=true}
function refreshLicenseSuggestions(){$('licenseSuggestions').innerHTML=listProviderLicenses().map(x=>`<option value="${esc(x)}"></option>`).join('')}
function addLicense(){const input=$('licenseInput');const val=input.value.trim();if(!val){input.focus();return}if(selectedLicenseNames.some(n=>n.toLowerCase()===val.toLowerCase())){toast('License already selected');input.select();return}selectedLicenseNames.push(val);input.value='';renderSelectedLicenses();input.focus()}
function updateAuth(){const v=$('formAuth').value;const username=v==='basic',secret=v!=='none',header=v==='api-key';$('usernameField').hidden=!username;$('formUsername').required=username;$('secretField').hidden=!secret;$('formSecret').required=secret;$('headerField').hidden=!header;$('secretLabel').innerHTML=(v==='api-key'?'API Key':v==='basic'?'Password':v==='oauth'?'Client Secret':'Access Token')+' <span class="req">*</span>';$('formSecret').placeholder=v==='api-key'?'Enter API key':v==='basic'?'Enter password':v==='oauth'?'Enter client secret':'Enter access token'}
function showForm(company=''){$('createForm').reset();$('formCompany').value=company||'vinfast';updateOwner();$('formName').value=companies[$('formCompany').value].name+' – '+providers[$('formProvider').value].name+' Usage';selectedLicenseNames=[];refreshLicenseSuggestions();renderSelectedLicenses();updateAuth();$('formSecret').type='password';$('modalOverlay').classList.add('open');document.body.style.overflow='hidden';$('formCompany').focus()}
function closeForm(){$('modalOverlay').classList.remove('open');document.body.style.overflow='';$('formSecret').value='';$('formUsername').value=''}
function updateOwner(){const [name,email]=people[$('formCompany').value]||['',''];$('formOwner').value=name;$('formEmail').value=email}
function showDetails(id){const c=connectors.find(x=>x.id===id);if(!c)return;const comp=companies[c.company],p=providers[c.provider];$('drawerTitle').textContent='Connector Details';$('drawerBody').innerHTML=`<div class="detail-entity">${providerLogo(c.provider)}<span>${esc(p.name)}</span></div><div class="detail-grid">
 <div><small>Company</small><strong>${esc(comp.name)}</strong></div><div><small>Connector ID</small><strong>${esc(c.id)}</strong></div>
 <div><small>API Contact</small><strong>${esc(c.owner)}</strong></div><div><small>Email</small><strong>${esc(c.email)}</strong></div>
 <div><small>Created</small><strong>${dateOnly(c.created)}</strong></div><div><small>Last Sync</small><strong>${dateOnly(c.sync)} ${timeOnly(c.sync)}</strong></div>
 <div><small>Sync Frequency</small><strong>${esc(c.frequency)}</strong></div><div><small>Licenses</small><strong>${c.licenses.length}</strong></div>${c.baseUrl?`<div><small>API Base URL</small><strong>${esc(c.baseUrl)}</strong></div>`:""}${c.auth?`<div><small>Authentication</small><strong>${esc(c.auth)}</strong></div>`:""}
 </div><div class="detail-section">Licenses</div>${c.licenses.map(l=>`<div class="detail-license"><div><strong>${esc(l.name)}</strong><small>${esc(l.id)}</small></div>${statusHtml(l.status)}</div>`).join('')}<div class="detail-section">Contact</div><a style="color:#376aa7" href="mailto:${esc(c.email)}">${icon('mail')} ${esc(c.email)}</a>`;$('drawerOverlay').classList.add('open')}
function closeDrawer(){$('drawerOverlay').classList.remove('open')}
$('newBtn').onclick=()=>showForm();$('closeModal').onclick=closeForm;$('cancelBtn').onclick=closeForm;$('closeDrawer').onclick=closeDrawer;$('drawerDone').onclick=closeDrawer;
$('modalOverlay').onclick=e=>{if(e.target===$('modalOverlay'))closeForm()};$('drawerOverlay').onclick=e=>{if(e.target===$('drawerOverlay'))closeDrawer()};document.onkeydown=e=>{if(e.key==='Escape'){closeForm();closeDrawer()}};
$('formCompany').onchange=()=>{updateOwner();$('formName').value=companies[$('formCompany').value].name+' – '+providers[$('formProvider').value].name+' Usage'};
$('formProvider').onchange=()=>{$('formName').value=companies[$('formCompany').value].name+' – '+providers[$('formProvider').value].name+' Usage';refreshLicenseSuggestions()};
$('formAuth').onchange=updateAuth;
$('addLicenseBtn').onclick=addLicense;
$('licenseInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addLicense()}};
$('toggleSecret').onclick=()=>{const field=$('formSecret');field.type=field.type==='password'?'text':'password';$('toggleSecret').setAttribute('aria-label',field.type==='password'?'Show credential':'Hide credential')};
$('createForm').onsubmit=e=>{e.preventDefault();if(!selectedLicenseNames.length){$('licenseError').hidden=false;$('licenseInput').focus();return}if(!$('createForm').reportValidity())return;
const id='CON-'+String(Math.max(...connectors.map(c=>parseInt(c.id.split('-')[1])))+1).padStart(4,'0');const nextLicense=Math.max(...connectors.flatMap(c=>c.licenses.map(l=>parseInt(l.id.split('-')[1]))))+1;const company=$('formCompany').value,provider=$('formProvider').value;
// This is a local UI prototype. Never save, print or persist API keys, tokens, passwords or client secrets.
const baseUrl=$('formBaseUrl').value.trim(),auth=$('formAuth').value,endpoint=$('formEndpoint').value.trim(),name=$('formName').value.trim();
connectors.unshift({id,company,provider,name,baseUrl,auth,endpoint,owner:$('formOwner').value.trim(),email:$('formEmail').value.trim(),frequency:$('formFrequency').value,created:new Date().toISOString(),sync:null,licenses:selectedLicenseNames.map((licenseName,i)=>({id:'LIC-'+String(nextLicense+i).padStart(4,'0'),name:licenseName,status:'pending'}))});
expandedCompanies.add(company);expandedProviders.add(id);state.company=company;state.provider='';state.status='';state.search='';state.page=1;$('searchInput').value='';$('companyFilter').value=company;$('providerFilter').value='';$('statusFilter').value='';closeForm();render();toast('Connector added to local preview')};
$('searchInput').oninput=e=>{state.search=e.target.value;state.page=1;if(state.search)autoExpandMatches();render()};
$('companyFilter').onchange=e=>{state.company=e.target.value;state.page=1;autoExpandMatches();render()};
$('providerFilter').onchange=e=>{state.provider=e.target.value;state.page=1;autoExpandMatches();render()};
$('statusFilter').onchange=e=>{state.status=e.target.value;state.page=1;autoExpandMatches();render()};
$('sortFilter').onchange=e=>{state.sort=e.target.value;state.page=1;render()};$('pageSize').onchange=e=>{state.size=Number(e.target.value);state.page=1;render()};
function autoExpandMatches(){if(!(state.search||state.company||state.provider||state.status))return;for(const c of filtered()){expandedCompanies.add(c.company);expandedProviders.add(c.id)}}
$('alerts').onclick=()=>{state.status='failed';state.page=1;$('statusFilter').value='failed';autoExpandMatches();render()};

document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>toast('Connector Management preview'));
populateOptions();render();
</script>
</body>
</html>
